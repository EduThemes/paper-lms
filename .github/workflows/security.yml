name: Security

# Security scanning gates. Split from ci.yml so security signal is legible on
# its own and can evolve independently. Posture (deliberately staged so the
# pipeline isn't flooded on day one):
#   BLOCKING today  — govulncheck (call-path CVEs): very low false-positive, so
#                     a red build is a real exploitable path.
#   ADVISORY today  — gosec, Trivy, gitleaks, npm audit. Findings surface in the
#                     Security tab (SARIF) or job logs for triage. Each job
#                     documents how to promote it to blocking once its initial
#                     backlog (and any allowlist) is settled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:37 UTC — re-scan unchanged code so newly disclosed CVEs in
    # pinned dependencies are caught without a push.
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  govulncheck:
    name: Go vuln scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        # BLOCKING. govulncheck only reports vulnerabilities reachable from code
        # this module actually calls, so a failure is a genuine exploitable path.
        run: govulncheck ./...

  gosec:
    name: Go SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # -no-fail keeps gosec ADVISORY: it never reds the build, it only
          # produces SARIF. Drop "-no-fail" to make gosec blocking once the
          # initial backlog is triaged. -exclude-dir keeps generated/vendored
          # and test scaffolding out of the signal.
          args: '-no-fail -fmt sarif -out gosec.sarif -severity medium -exclude-dir=web ./...'
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: catch a secret committed in any prior commit
      - name: Run gitleaks
        # The gitleaks GitHub Action requires a paid license for org-owned
        # repos; the gitleaks BINARY is free, so run it directly. Advisory for
        # now (|| true) — review the first run, add a .gitleaks.toml allowlist
        # for any false positives, then drop "|| true" to make it blocking.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner -v || true

  trivy-fs:
    name: Dependency + IaC scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        # ADVISORY: prints CRITICAL/HIGH dependency CVEs, leaked secrets, and
        # Dockerfile/IaC misconfigurations to the log without failing the build
        # (--exit-code 0). To promote to blocking, set --exit-code 1 and (for
        # the Security tab) add `--format sarif --output trivy.sarif` + a SARIF
        # upload via a pinned, valid aquasecurity/trivy-action release.
        run: trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --exit-code 0 --no-progress .

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm audit (high+)
        working-directory: web
        # ADVISORY: "|| true" keeps transitive, often-unfixable dev advisories
        # from blocking. Remove it to make the production tree's high/critical
        # advisories blocking.
        run: npm audit --omit=dev --audit-level=high || true
