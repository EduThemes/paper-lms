# golangci-lint configuration (v2 schema — matches golangci-lint-action@v8).
#
# CI runs this over the whole tree and the lint step is BLOCKING; the
# pre-existing baseline was cleared, so keep it at zero findings.
version: "2"

run:
  timeout: 5m

linters:
  # The standard high-signal set: errcheck, govet, ineffassign,
  # staticcheck, unused. These catch unchecked errors, dead code, and
  # real correctness smells without the noise of style-only linters.
  default: standard
  exclusions:
    paths:
      # Vendored npm packages (e.g. flatted ships a Go port) are not ours.
      - web/node_modules
